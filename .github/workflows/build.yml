name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the binaries to this existing release tag (e.g. v1.0.0); leave empty for artifacts only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built: intermod-kalkulator.exe
            asset: intermod-windows-x64.exe
          # 22.04 on purpose: the binary links against the runner's glibc
          # (2.35), so it also runs on older/current distributions
          - os: ubuntu-22.04
            built: intermod-kalkulator
            asset: intermod-linux-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import intermod, ms2711d; print(intermod.parse_frekvencije('455 kHz, 2,4 GHz')); print(ms2711d.portovi())"

      - name: Build
        run: |
          pyinstaller --noconfirm intermod-kalkulator.spec
          mv "dist/${{ matrix.built }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          # both jobs may try to create the release; the loser just uploads
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" "dist/${{ matrix.asset }}" --clobber
